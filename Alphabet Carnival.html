   GAME — Tilt-a-Whirl: Spin and Stop
============================================================ */
function initWheelStop(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const spinLevel = state.custom.spinSpeed || 4;
  const spinDegPerTick = 1.2 + ((spinLevel-1)/9) * (7.5-1.2);
  const rounds = state.amount;
  const segLetters = pickN(pool, 8);
  let round=0, score=0, spinning=false, currentAngle=0, spinInterval=null;
  const area=playArea();
  area.innerHTML = `<div class="spin-stage">
      <div class="target-sign">${icon('target')}<span>${T('findLabel')}</span> <span id="spin-target"></span></div>
      <div class="spin-wheel-wrap">
        <div class="spin-pointer"></div>
        <div class="spin-wheel" id="spin-wheel"></div>
      </div>
      <button class="btn-start spin-stop-btn" id="spin-stop-btn">${T('stopLabel')}</button>
    </div>`;
  const wheel=document.getElementById('spin-wheel');
  const segAngle = 360/segLetters.length;
  segLetters.forEach((letter,i)=>{
    const seg=document.createElement('div');
    seg.className='spin-seg';
    seg.style.transform=`rotate(${(i+0.5)*segAngle}deg)`;
    seg.innerHTML=`<span>${letter}</span>`;
    wheel.appendChild(seg);
  });
  function nextRound(){
    if(round>=rounds){ endGame(score, rounds); return; }
    const target = segLetters[randInt(0,segLetters.length-1)];
    document.getElementById('spin-target').textContent=target;
    setPlayInfo(T('roundScore', round+1, rounds, score));
    spinning=true;
    const stopBtn=document.getElementById('spin-stop-btn');
    stopBtn.disabled=false;
    const speed=spinDegPerTick;
    spinInterval=setInterval(()=>{
      currentAngle=(currentAngle+speed)%360;
      wheel.style.transform=`rotate(${currentAngle}deg)`;
    }, 16);
    activeTimers.push(spinInterval);
    stopBtn.onclick=()=>{
      if(!spinning) return;
      spinning=false;
      clearInterval(spinInterval);
      stopBtn.disabled=true;
      const normalized = (360 - (currentAngle % 360)) % 360;
      const segIndex = Math.floor(normalized / segAngle) % segLetters.length;
      const landed = segLetters[segIndex];
      if(landed===target){ playCorrect(); score++; }
      else { playWrong(); }
      round++;
      trackedTimeout(nextRound, 900);
    };
  }
  nextRound();
}

============================================================ */
function initSprint(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const diff = state.custom.difficulty || 'medium';
  const optionCount = { easy:4, medium:6, hard:8 }[diff];
  const timeLimitMs = state.amount*1000;
  const myRun = gameRunId;
  let score=0, misses=0, target, finished=false;
  const area=playArea();
  area.innerHTML = `<div class="sprint-stage">
      <div class="target-sign">${icon('clock')}<span>${T('findLabel')}</span> <span id="sprint-target"></span></div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="sprint-timer"></div></div>
      <div class="balloon-field" id="sprint-field"></div>
    </div>`;
  const balloonColors=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
  const endTime = Date.now()+timeLimitMs;
  function updateBar(){
    if(finished || myRun!==gameRunId) return;
    const remain = Math.max(0, endTime-Date.now());
    const pct = remain/timeLimitMs*100;
    const bar=document.getElementById('sprint-timer');
    if(bar) bar.style.width = pct+'%';
    setPlayInfo(T('sprintScore', score, Math.ceil(remain/1000)));
    if(remain<=0){
      finished=true;
      endGame(score, Math.max(score+misses,1));
      return;
    }
    requestAnimationFrame(updateBar);
  }
  function nextTarget(){
    if(finished || myRun!==gameRunId) return;
    target = pool[randInt(0,pool.length-1)];
    const el=document.getElementById('sprint-target');
    if(el) el.textContent=target;
    const distractors = pickN(pool.filter(l=>l!==target), Math.max(1, optionCount-1));
    const options = shuffle([target, ...distractors]);
    const field=document.getElementById('sprint-field');
    field.innerHTML='';
    options.forEach(letter=>{
      const b=document.createElement('button'); b.className='balloon';
      b.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 45%), ${balloonColors[randInt(0,balloonColors.length-1)]}`;
      b.style.setProperty('--float-delay', (Math.random()*2)+'s');
      b.textContent=letter;
      b.onclick=()=>{
        if(finished) return;
        if(letter===target){
          playCorrect(); score++;
          const r=b.getBoundingClientRect(); confettiBurst(r.left+r.width/2, r.top);
          nextTarget();
        } else {
          playWrong(); misses++;
          b.classList.add('shake'); trackedTimeout(()=>b.classList.remove('shake'),400);
        }
      };
      field.appendChild(b);
    });
  }
  nextTarget();
  updateBar();
}

/* ============================================================

============================================================ */
document.addEventListener('DOMContentLoaded', ()=>{
  buildLights(document.getElementById('lights-top'), 30);
  buildLights(document.getElementById('lights-bottom'), 30);
  buildLights(document.getElementById('lights-left'), 14);
  buildLights(document.getElementById('lights-right'), 14);
  buildFloaters();
  updateLangToggleLabel();
  applyTranslations();
  buildTicker();
  livenUpTitle();

  document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);

  document.querySelectorAll('.tent-card').forEach(btn=>{
    btn.addEventListener('click', ()=>openGames(parseInt(btn.dataset.grade,10)));
  });

  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      detachKeyHandler();
      const nav = btn.dataset.nav;
      if(nav==='menu') showScreen('screen-menu');
      if(nav==='games') openGames(state.grade);
      if(nav==='setup'){ renderSetup(currentGame()); showScreen('screen-setup'); }
    });
  });
});
</script>
