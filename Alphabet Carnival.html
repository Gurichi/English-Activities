<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Carnival</title>
<style>
:root{
  --red:#e63946;
  --red-dark:#c1121f;
  --gold:#ffb703;
  --gold-dark:#fb8500;
  --teal:#219ebc;
  --navy:#14213d;
  --cream:#fff6e5;
  --pink:#ff5d8f;
  --green:#43aa8b;
  --purple:#6a4c93;
  --paper:#fffaf0;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, #fff2d0 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, #ffe0ec 0%, transparent 45%),
    var(--cream);
  font-family:'Comic Sans MS','Comic Sans','Chalkboard SE','Marker Felt','Comic Neue',cursive,sans-serif;
  color:var(--navy);
  overflow-x:hidden;
}
body{ padding:30px; }

h1,h2,h3{ margin:0; font-family:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; }

/* ---------- Icon system (no emoji, hand-built line icons) ---------- */
.icon{ display:inline-flex; align-items:center; justify-content:center; line-height:0; }
.icon-svg{ width:1em; height:1em; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.icon-svg .dot{ fill:currentColor; stroke:none; }
.icon-svg.star-fill{ fill:currentColor; stroke:none; }

/* ---------- Language toggle ---------- */
.lang-toggle{
  position:fixed; top:36px; right:36px; z-index:60;
  background:var(--purple); color:#fff; font-weight:800;
  padding:8px 16px; border-radius:999px; box-shadow:0 3px 0 #4a3468;
  transition:transform .12s;
}
.lang-toggle:hover{ transform:translateY(-2px); }
.lang-toggle:active{ transform:translateY(1px); box-shadow:0 1px 0 #4a3468; }

/* ---------- Ambient floating background ---------- */
#bg-decor{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.floater{ position:absolute; bottom:-60px; border-radius:50%; opacity:.28; animation:floatUp linear infinite; }
@keyframes floatUp{
  from{ transform:translateY(0) translateX(0) rotate(0deg); }
  to{ transform:translateY(-118vh) translateX(24px) rotate(200deg); }
}

/* ---------- Full-screen marquee light border ---------- */
.lights-frame{ position:fixed; inset:0; z-index:55; pointer-events:none; }
.lights-edge{ position:absolute; display:flex; background:repeating-linear-gradient(90deg, var(--navy) 0 40px, #0d1830 40px 80px); }
.lights-edge.top{ top:0; left:0; right:0; height:26px; justify-content:space-around; align-items:center; }
.lights-edge.bottom{ bottom:0; left:0; right:0; height:26px; justify-content:space-around; align-items:center; }
.lights-edge.left{ top:0; bottom:0; left:0; width:26px; flex-direction:column; justify-content:space-around; align-items:center; background:repeating-linear-gradient(180deg, var(--navy) 0 40px, #0d1830 40px 80px); }
.lights-edge.right{ top:0; bottom:0; right:0; width:26px; flex-direction:column; justify-content:space-around; align-items:center; background:repeating-linear-gradient(180deg, var(--navy) 0 40px, #0d1830 40px 80px); }
.bulb{
  width:12px; height:12px; border-radius:50%; flex:none;
  background:var(--gold);
  box-shadow:0 0 8px 2px rgba(255,183,3,.9);
  animation:chase 1.7s infinite;
}
.bulb:nth-child(3n){ background:var(--red); box-shadow:0 0 8px 2px rgba(230,57,70,.9); }
.bulb:nth-child(3n+1){ background:var(--teal); box-shadow:0 0 8px 2px rgba(33,158,188,.9); }
@keyframes chase{
  0%,100%{ opacity:.25; transform:scale(.7); }
  12%{ opacity:1; transform:scale(1.2); }
  28%{ opacity:.25; transform:scale(.7); }
}

/* ---------- Canopy stripe band ---------- */
.canopy-band{
  height:10px; width:100%;
  background:repeating-linear-gradient(45deg, var(--red) 0 20px, var(--paper) 20px 40px);
  background-size:56.6px 100%;
  animation:marchStripes 3s linear infinite;
  position:relative; z-index:2;
}
@keyframes marchStripes{ from{ background-position:0 0; } to{ background-position:56.6px 0; } }

#app{ max-width:1150px; margin:0 auto; padding:20px 24px 40px; position:relative; z-index:1; }

.screen{ display:none; }
.screen.active{ display:block; animation:fadein .35s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ---------- Buttons: back / nav ---------- */
.btn-back{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--navy); color:var(--cream);
  padding:10px 18px; border-radius:999px 12px 999px 12px; font-weight:700; font-size:1rem;
  box-shadow:0 3px 0 #05122b;
  transition:transform .12s, box-shadow .12s;
}
.btn-back .icon-svg{ width:1.1em; height:1.1em; }
.btn-back:hover{ transform:translateY(-2px); }
.btn-back:active{ transform:translateY(1px); box-shadow:0 1px 0 #05122b; }
.btn-back.small{ padding:8px 14px; font-size:.9rem; }

/* ---------- Menu screen ---------- */
.big-top-header{ text-align:center; padding:18px 0 8px; }
.title-row{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
.title-tent-icon{
  font-size:2.3rem; color:var(--gold-dark);
  display:inline-flex; animation:signSwing 3.4s ease-in-out infinite;
  transform-origin:bottom center;
}
.title-tent-icon.right{ animation-delay:.5s; transform:scaleX(-1); }
.big-top-header h1{
  font-size:clamp(1.6rem, 5vw, 3.1rem);
  display:flex; flex-wrap:wrap; justify-content:center; gap:1px;
  letter-spacing:1px; min-height:1.3em;
}
.wave-letter{
  display:inline-block;
  text-shadow:3px 3px 0 var(--navy);
  animation:letterBounceTilt 2.4s ease-in-out infinite;
}
.t-red{color:var(--red);} .t-gold{color:var(--gold-dark);} .t-teal{color:var(--teal);}
.t-pink{color:var(--pink);} .t-purple{color:var(--purple);} .t-green{color:var(--green);}
@keyframes letterBounceTilt{
  0%,100%{ transform:translateY(0) rotate(var(--tilt,0deg)); }
  50%{ transform:translateY(-10px) rotate(var(--tilt,0deg)); }
}
.big-top-header .subtitle{ margin-top:10px; font-size:1.2rem; color:var(--navy); font-weight:700; }

.ticker{
  overflow:hidden; background:var(--navy);
  border-top:3px solid var(--gold); border-bottom:3px solid var(--gold);
  margin:20px 0; padding:9px 0; border-radius:6px;
}
.ticker-track{ display:flex; width:max-content; animation:tickerScroll 20s linear infinite; }
.ticker-track span{ white-space:nowrap; color:var(--gold); font-weight:700; font-size:1.05rem; letter-spacing:.4px; padding-right:6px; }
@keyframes tickerScroll{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

.grade-tents{ display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:30px; }
@media(max-width:700px){ .grade-tents{ grid-template-columns:1fr; } }

.tent-card{
  position:relative; background:var(--paper);
  border-radius:22px 22px 12px 12px; padding:38px 22px 26px; text-align:center;
  border:4px solid var(--navy); box-shadow:0 8px 0 rgba(0,0,0,.15);
  animation:signSwing 5s ease-in-out infinite; transform-origin:top center; overflow:hidden;
}
.tent-card.grade4{ animation-delay:.4s; }
.tent-card:hover{ animation:none; transform:translateY(-6px) rotate(-1deg) scale(1.02); transition:transform .18s; }
@keyframes signSwing{ 0%,100%{ transform:rotate(-1.2deg);} 50%{ transform:rotate(1.2deg);} }
.tent-roof{
  position:absolute; top:0; left:0; right:0; height:16px;
  background:repeating-linear-gradient(90deg, var(--red) 0 22px, var(--paper) 22px 44px);
  background-size:44px 100%; animation:marchStripes2 2.4s linear infinite;
}
.tent-card.grade4 .tent-roof{
  background:repeating-linear-gradient(90deg, var(--teal) 0 22px, var(--paper) 22px 44px);
  background-size:44px 100%;
}
@keyframes marchStripes2{ from{ background-position:0 0;} to{ background-position:44px 0;} }
.tent-letters{ display:flex; gap:4px; justify-content:center; font-size:2.6rem; font-weight:800; margin-bottom:6px; }
.tent-letters span{ display:inline-block; animation:letterBounceTilt 2.2s ease-in-out infinite; }
.tent-letters .l1{ color:var(--red); }
.tent-letters .l2{ color:var(--gold-dark); }
.tent-letters .l3{ color:var(--teal); }
.tent-card h2{ font-size:1.6rem; color:var(--red-dark); margin-top:4px; }
.tent-card.grade4 h2{ color:var(--teal); }
.tent-card p{ margin-top:6px; font-weight:700; color:var(--navy); }

/* ---------- Games list ---------- */
#games-title{ text-align:center; margin:18px 0 26px; font-size:1.85rem; color:var(--navy); }
.games-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
@media(max-width:900px){ .games-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:600px){ .games-grid{ grid-template-columns:1fr; } }

.stall-card{
  position:relative; background:var(--paper);
  border:3px dashed var(--gold-dark); border-radius:20px 12px 20px 14px;
  padding:22px 16px 18px; text-align:center; box-shadow:6px 6px 0 rgba(20,33,61,.12);
  animation:signSwing 4.5s ease-in-out infinite; transform-origin:top center;
}
.stall-card:nth-child(2n){ border-color:var(--red); animation-delay:.25s; }
.stall-card:nth-child(3n){ border-color:var(--teal); animation-delay:.5s; }
.stall-card:nth-child(4n){ border-color:var(--purple); animation-delay:.75s; }
.stall-card:hover{ animation:none; transform:translateY(-5px) scale(1.03); transition:transform .15s; }
.stall-icon{ font-size:2.2rem; color:var(--navy); }
.stall-card:nth-child(2n) .stall-icon{ color:var(--red); }
.stall-card:nth-child(3n) .stall-icon{ color:var(--teal); }
.stall-card:nth-child(4n) .stall-icon{ color:var(--purple); }
.stall-card h3{ font-size:1.05rem; margin-top:8px; color:var(--navy); }
.stall-card p{ margin-top:6px; font-size:.86rem; color:#555; font-weight:700; }
.ribbon{
  position:absolute; top:-10px; right:14px; background:var(--red); color:#fff;
  font-weight:700; font-size:.8rem; padding:5px 12px; border-radius:0 0 8px 8px;
  box-shadow:0 3px 0 var(--red-dark);
}

/* ---------- Setup / poster ---------- */
.poster{
  background:var(--paper); border:5px solid var(--navy); border-radius:24px 18px 26px 16px;
  padding:30px 34px; max-width:760px; margin:10px auto 0; position:relative;
  box-shadow:0 10px 0 rgba(20,33,61,.15);
}
.poster-star{
  position:absolute; top:-22px; left:-22px; background:var(--gold); color:var(--navy);
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; border:3px solid var(--navy); animation:spin 6s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.poster h2{ font-size:1.5rem; color:var(--red-dark); text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
.poster h2 .icon-svg{ width:1.3em; height:1.3em; }
.tagline{ text-align:center; font-weight:700; margin-top:6px; color:var(--navy); }
.instructions-box{ margin-top:20px; background:#fff; border:2px solid var(--gold-dark); border-radius:16px 10px 16px 10px; padding:14px 20px; }
.instructions-box h3{ font-size:1.05rem; color:var(--navy); display:flex; align-items:center; gap:8px; }
.instructions-box ul{ margin:10px 0 0; padding-left:22px; }
.instructions-box li{ margin-bottom:6px; font-weight:600; line-height:1.4; }

.settings-row{ display:flex; gap:24px; flex-wrap:wrap; margin-top:22px; justify-content:center; }
.setting-group{ flex:1; min-width:200px; }
.setting-group > label{ display:block; font-weight:700; margin-bottom:8px; text-align:center; }
.amount-buttons{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.amt-btn{
  background:#fff; border:2px solid var(--teal); color:var(--navy);
  padding:8px 14px; border-radius:999px; font-weight:700; transition:all .12s;
}
.amt-btn:hover{ background:var(--teal); color:#fff; }
.amt-btn.active{ background:var(--teal); color:#fff; box-shadow:0 2px 0 #146d87; }
.amt-btn.random-btn{ border-color:var(--purple); color:var(--purple); display:inline-flex; align-items:center; gap:6px; }
.amt-btn.random-btn:hover{ background:var(--purple); color:#fff; }
.amount-label{ text-align:center; margin-top:8px; font-weight:700; color:var(--purple); }
.case-toggle{ display:flex; gap:10px; justify-content:center; }
.case-btn{
  background:#fff; border:2px solid var(--red); color:var(--red-dark);
  padding:9px 22px; border-radius:999px; font-weight:800; font-size:1.05rem; transition:all .12s;
}
.case-btn:hover{ background:var(--red); color:#fff; }
.case-btn.active{ background:var(--red); color:#fff; box-shadow:0 2px 0 var(--red-dark); }
.note{ text-align:center; font-style:italic; color:#666; font-weight:600; font-size:.92rem; }
.color-input{ width:64px; height:40px; border:2px solid var(--navy); border-radius:10px; padding:2px; cursor:pointer; display:block; margin:0 auto; }

.checkbox-label{ display:inline-flex; align-items:center; gap:10px; font-weight:700; cursor:pointer; justify-content:center; width:100%; }
.toggle-check{
  -webkit-appearance:none; appearance:none; position:relative; flex:none;
  width:46px; height:26px; background:#d8d0c0; border-radius:999px;
  border:2px solid var(--navy); cursor:pointer; transition:background .2s;
}
.toggle-check::before{
  content:''; position:absolute; top:1px; left:1px; width:18px; height:18px; border-radius:50%;
  background:#fff; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.toggle-check:checked{ background:var(--green); }
.toggle-check:checked::before{ transform:translateX(20px); }

.range-group{ text-align:center; }
.range-val{ color:var(--purple); font-weight:800; }
input.speed-slider{
  -webkit-appearance:none; appearance:none;
  width:100%; max-width:260px; height:10px; border-radius:999px;
  background:linear-gradient(90deg, var(--teal), var(--gold));
  outline:none; cursor:pointer; margin:8px auto 2px; display:block;
}
input.speed-slider::-webkit-slider-runnable-track{ height:10px; border-radius:999px; background:transparent; }
input.speed-slider::-moz-range-track{ height:10px; border-radius:999px; background:transparent; }
input.speed-slider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--red); border:3px solid var(--navy); cursor:pointer; margin-top:-8px;
  box-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .1s;
}
input.speed-slider::-webkit-slider-thumb:hover{ transform:scale(1.1); }
input.speed-slider::-moz-range-thumb{
  width:26px; height:26px; border-radius:50%; background:var(--red); border:3px solid var(--navy); cursor:pointer;
}
.slider-caption-row{ display:flex; justify-content:space-between; max-width:260px; margin:2px auto 0; font-size:.8rem; font-weight:700; color:#777; }

.btn-start{
  display:block; margin:28px auto 4px; background:var(--gold); color:var(--navy);
  font-size:1.25rem; font-weight:800; padding:14px 40px; border-radius:999px;
  border:3px solid var(--navy); box-shadow:0 5px 0 var(--gold-dark);
  animation:pulseGlow 1.9s ease-in-out infinite; transition:transform .12s;
}
.btn-start:hover{ animation:none; transform:translateY(-2px); }
.btn-start:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--gold-dark); }
@keyframes pulseGlow{
  0%,100%{ box-shadow:0 5px 0 var(--gold-dark), 0 0 0 rgba(255,183,3,.6); }
  50%{ box-shadow:0 5px 0 var(--gold-dark), 0 0 20px 5px rgba(255,183,3,.55); }
}

/* ---------- Play screen ---------- */
.play-topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,#8b5a2b,#6b4423);
  border-radius:14px; padding:10px 18px; margin-bottom:18px; box-shadow:0 4px 0 rgba(0,0,0,.25);
}
#play-info{
  background:#0d1830; color:#ffd166; font-weight:700; padding:8px 18px; border-radius:8px;
  font-size:1.05rem; letter-spacing:.5px; text-align:center; border:2px solid #ffd166;
}
#play-area{ min-height:420px; position:relative; }

.target-sign{
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  text-align:center; background:var(--navy); color:#fff; font-size:1.5rem; font-weight:800;
  padding:14px 20px; border-radius:14px 20px 14px 20px; margin-bottom:24px; border:3px dashed var(--gold);
}
.target-sign > .icon{ color:var(--gold); }
.target-sign .icon-svg{ width:1.4em; height:1.4em; }
.target-sign span[id$="-target"]{ color:var(--gold); font-size:1.9rem; }
.target-sign span[id$="-target"].target-pop{ animation:clawPop .25s ease; }

/* ---------- Balloons ---------- */
.balloon-field{ display:flex; flex-wrap:wrap; gap:26px; justify-content:center; align-items:flex-start; padding:20px 10px; }
.balloon{
  width:96px; height:112px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  display:flex; align-items:center; justify-content:center; font-size:2.1rem; font-weight:800; color:#fff;
  text-shadow:0 2px 3px rgba(0,0,0,.25);
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.15), 0 6px 10px rgba(0,0,0,.18);
  animation:float 3s ease-in-out infinite; animation-delay:var(--float-delay, 0s);
  transition:transform .15s; position:relative;
}
.balloon::after{
  content:''; position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent;
  border-top:8px solid rgba(0,0,0,.25);
}
.balloon:hover{ animation:none; transform:scale(1.08) rotate(-3deg); }
.balloon.pop{ animation:popOut .35s forwards; }
.balloon.shake{ animation:shakeX .4s; }
@keyframes float{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-11px) rotate(2deg); } }
@keyframes popOut{ to{ transform:scale(0) rotate(20deg); opacity:0;} }
@keyframes shakeX{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

/* ---------- Order trail ---------- */
.order-trail{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px; }
.trail-letter{
  width:36px; height:36px; border-radius:8px; background:#fff; border:2px solid var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--navy);
}
.trail-letter.trail-done{ background:var(--green); color:#fff; border-color:#2f7a63; }

/* ---------- Whack-a-letter ---------- */
.timer-bar-wrap{ max-width:400px; margin:0 auto 22px; height:14px; background:#e2d5c0; border-radius:999px; overflow:hidden; border:2px solid var(--navy); }
.timer-bar{ height:100%; width:100%; background:linear-gradient(90deg,var(--green),var(--gold)); }
.mole-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:520px; margin:0 auto; }
.mole-hole{
  background:radial-gradient(circle at 50% 40%, #6b4423, #3d2712 75%); border-radius:50%; aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center; box-shadow:inset 0 8px 14px rgba(0,0,0,.5);
  overflow:hidden; animation:holePulse 2.6s ease-in-out infinite;
}
@keyframes holePulse{ 0%,100%{ box-shadow:inset 0 8px 14px rgba(0,0,0,.5); } 50%{ box-shadow:inset 0 11px 18px rgba(0,0,0,.65); } }
.mole{
  width:72%; height:72%; border-radius:16px; background:var(--purple); color:#fff; font-size:1.8rem; font-weight:800;
  display:flex; align-items:center; justify-content:center; animation:popUp .5s ease both; box-shadow:0 4px 0 #4a3468;
}
@keyframes popUp{ from{ transform:translateY(60%);} to{ transform:translateY(0);} }
.mole.whacked{ animation:whackDown .4s forwards; background:var(--green); }
.mole.shake{ animation:shakeX .4s; }
@keyframes whackDown{ to{ transform:translateY(70%) scale(.8); opacity:0;} }

/* ---------- Ferris wheel ---------- */
.ferris-wrap{ display:flex; justify-content:center; padding:30px 10px 10px; }
.ferris-wheel{
  position:relative; width:520px; height:520px; max-width:92vw; max-height:92vw; border-radius:50%;
  border:6px solid var(--teal);
  background:repeating-conic-gradient(from 0deg, rgba(33,158,188,.12) 0deg 4deg, transparent 4deg 30deg);
  transform-origin:center center; animation:wheelSpin 36s linear infinite;
}
.ferris-wheel::before{
  content:''; position:absolute; top:50%; left:50%; width:26px; height:26px;
  background:var(--navy); border-radius:50%; transform:translate(-50%,-50%);
}
@keyframes wheelSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
.cabin{
  position:absolute; top:50%; left:50%; width:64px; height:64px; margin:-32px 0 0 -32px;
  border-radius:14px; background:var(--gold); border:3px solid var(--navy); box-shadow:0 4px 0 var(--gold-dark);
  transition:background .2s;
}
.cabin.flipped{ background:#fff; }
.cabin.matched{ background:var(--green); border-color:#2f7a63; }
.cabin-inner{
  position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; font-weight:800; color:var(--navy); animation:wheelSpinReverse 36s linear infinite;
}
.cabin.matched .cabin-inner{ color:#fff; }
@keyframes wheelSpinReverse{ from{ transform:rotate(0deg);} to{ transform:rotate(-360deg);} }
.cabin .cabin-face{ display:none; }
.cabin .cabin-back{ display:flex; }
.cabin.flipped .cabin-face{ display:flex; }
.cabin.flipped .cabin-back{ display:none; }

/* ---------- Find the difference ---------- */
.diff-stage{ text-align:center; }
.diff-instruction{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:1.2rem; font-weight:700; margin-bottom:20px; }
.diff-instruction > .icon{ color:var(--red); }
.diff-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; max-width:560px; margin:0 auto; }
.diff-cell{
  background:var(--paper); border:3px solid var(--navy); border-radius:10px; aspect-ratio:1/1;
  font-size:1.9rem; font-weight:800; color:var(--navy); box-shadow:3px 3px 0 rgba(0,0,0,.12); transition:transform .12s;
}
.diff-cell:hover{ transform:scale(1.06); }
.diff-cell.found{ background:var(--green); color:#fff; animation:popOut .5s .1s forwards; }
.diff-cell.shake{ animation:shakeX .4s; }

/* ---------- Fishing pond ---------- */
.pond-stage{ text-align:center; }
.pond{
  position:relative; height:340px; border-radius:20px; overflow:hidden;
  background:linear-gradient(180deg,#8ecae6,#219ebc 60%, #126782); border:5px solid #6b4423;
}
.pond::before{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 3px, transparent 3px 16px);
}
.fish{
  position:absolute; left:-90px; top:40%; width:70px; height:36px;
  animation:swim var(--dur,8s) linear infinite; animation-delay:var(--delay,0s);
  background:none;
}
.fish-tail{
  position:absolute; left:-3px; top:50%; transform:translateY(-50%);
  width:0; height:0; border-top:11px solid transparent; border-bottom:11px solid transparent;
  border-right:15px solid var(--fish-color, var(--gold)); animation:tailWag .5s ease-in-out infinite;
}
@keyframes tailWag{ 0%,100%{ transform:translateY(-50%) scaleX(1);} 50%{ transform:translateY(-50%) scaleX(.65);} }
.fish-fin{
  position:absolute; top:-7px; left:26px; width:0; height:0;
  border-left:7px solid transparent; border-right:7px solid transparent;
  border-bottom:9px solid var(--fish-color, var(--gold)); opacity:.85;
}
.fish-body{
  position:absolute; left:13px; right:0; top:0; bottom:0;
  background:var(--fish-color, var(--gold)); border-radius:50%;
  box-shadow:0 3px 6px rgba(0,0,0,.25), inset -4px -4px 0 rgba(0,0,0,.08);
}
.fish-eye{ position:absolute; width:6px; height:6px; border-radius:50%; background:#0d1830; right:9px; top:10px; }
.fish-letter{
  position:absolute; inset:0 0 0 13px; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1rem; color:#0d1830; z-index:2;
}
@keyframes swim{
  0%{ left:-90px; transform:translateY(0); }
  50%{ transform:translateY(-14px); }
  100%{ left:105%; transform:translateY(0); }
}
.fish.caught{ animation:none; transform:translateY(-140px) rotate(-15deg); opacity:0; transition:all .5s; }
.fish.dart{ animation-duration:.3s !important; }

/* ---------- Strongman / High Striker / Keyboard Smash ---------- */
.strongman-stage{ display:flex; gap:36px; justify-content:center; align-items:flex-end; flex-wrap:wrap; padding-top:10px;}
.tower{ display:flex; flex-direction:column; align-items:center; }
.bell{ font-size:2.2rem; margin-bottom:4px; color:#8a8a8a; transition:color .3s, transform .3s; }
.bell.rung{ color:var(--gold-dark); animation:ring .6s ease 2; }
@keyframes ring{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-18deg);} 75%{ transform:rotate(18deg);} }
.tower-track{
  position:relative; width:36px; height:300px; border-radius:10px;
  background:repeating-linear-gradient(0deg, #7a5230 0 26px, #6b4423 26px 30px); border:3px solid var(--navy);
}
.meter-fill{
  position:absolute; bottom:0; left:0; right:0; height:0%;
  background:linear-gradient(0deg, var(--red) 0%, var(--gold) 60%, var(--green) 100%);
  border-radius:0 0 7px 7px;
}
.puck{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:1.6rem; color:var(--red); z-index:2; }
.letter-buttons{ display:flex; flex-wrap:wrap; gap:12px; max-width:460px; justify-content:center; }
.sm-btn{
  background:var(--red); color:#fff; font-size:1.3rem; font-weight:800; width:56px; height:56px; border-radius:12px;
  box-shadow:0 4px 0 var(--red-dark); transition:transform .1s, box-shadow .1s;
}
.sm-btn:hover{ transform:translateY(-2px); }
.sm-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
.sm-btn.hit{ background:var(--green); box-shadow:0 4px 0 #2f7a63; opacity:.5; }
.sm-btn.shake{ animation:shakeX .4s; }
.sm-btn:disabled{ pointer-events:none; }
.keyboard-info{ display:flex; flex-direction:column; gap:14px; align-items:center; }

/* ---------- Coin match ---------- */
.coin-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(76px,1fr)); gap:16px; max-width:640px; margin:0 auto; }
.coin{ aspect-ratio:1/1; border-radius:50%; background:transparent; perspective:600px; }
.coin-inner{ position:relative; width:100%; height:100%; display:block; transform-style:preserve-3d; transition:transform .4s; }
.coin.flipped .coin-inner, .coin.matched .coin-inner{ transform:rotateY(180deg); }
.coin-back, .coin-face{
  position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
  backface-visibility:hidden; font-weight:800; font-size:1.5rem; border:3px solid var(--gold-dark);
}
.coin-back{ background:radial-gradient(circle at 35% 30%, #ffe27a, var(--gold)); font-size:1.7rem; color:var(--navy); }
.coin-face{ background:var(--paper); color:var(--navy); transform:rotateY(180deg); }
.coin.matched .coin-face{ background:var(--green); color:#fff; }

/* ---------- Flying Letters ---------- */
.fly-stage-wrap{ text-align:center; }
.fly-stage{
  position:relative; height:380px; border-radius:20px; overflow:hidden;
  background:linear-gradient(180deg,#dceeff,#bcdcff 60%,#9cc7f5); border:5px solid var(--navy);
}
.fly-letter{
  position:absolute; background:none; border:none; font-weight:800;
  animation-name:flyAcross; animation-timing-function:linear; animation-fill-mode:forwards;
  animation-duration:var(--fly-dur,4s); text-shadow:2px 2px 0 rgba(0,0,0,.2);
  padding:4px 10px; cursor:pointer; line-height:1; transform:translate(-50%,-50%);
}
@keyframes flyAcross{ from{ left:var(--sx); top:var(--sy);} to{ left:var(--ex); top:var(--ey);} }
.fly-letter.wrong-flash{ animation-play-state:paused; filter:brightness(.5); }

/* ---------- Vowel / Consonant Sort ---------- */
.sort-stage{ text-align:center; }
.sort-bins{ display:flex; gap:40px; justify-content:center; margin-top:26px; flex-wrap:wrap; }
.sort-bin{
  width:150px; height:150px; border-radius:16px 16px 50% 50%/16px 16px 40% 40%;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:16px;
  font-size:1.2rem; font-weight:800; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.2); transition:transform .12s;
}
.sort-bin:hover{ transform:translateY(-4px); }
.vowel-bin{ background:repeating-linear-gradient(45deg, var(--red) 0 12px, var(--red-dark) 12px 24px); }
.consonant-bin{ background:repeating-linear-gradient(45deg, var(--teal) 0 12px, #146d87 12px 24px); }
.sort-bin.shake{ animation:shakeX .4s; }
.sort-bin.bin-correct{ animation:binPulse .45s ease; }
@keyframes binPulse{ 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }

/* ---------- Claw Machine ---------- */
.claw-stage{ text-align:center; }
.claw-window{
  width:220px; height:220px; margin:24px auto; border-radius:20px;
  background:linear-gradient(180deg,#2b2140,#4a3468); border:6px solid var(--gold-dark);
  display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 30px rgba(0,0,0,.5);
  position:relative; overflow:hidden; transition:background .3s;
}
.claw-letter{ font-size:5rem; font-weight:800; color:#fff; animation:clawPop .3s ease; }
@keyframes clawPop{ from{ transform:scale(.5); opacity:0;} to{ transform:scale(1); opacity:1;} }
.claw-window.claw-correct{ background:linear-gradient(180deg,#2f7a4a,#43aa8b); }
.claw-window.claw-wrong{ background:linear-gradient(180deg,#8a2020,#c1121f); }
.claw-buttons{ display:flex; gap:20px; justify-content:center; }
.claw-btn{ font-size:1.3rem; font-weight:800; padding:14px 36px; border-radius:999px; color:#fff; transition:transform .1s; }
.claw-btn:hover{ transform:translateY(-2px); }
.grab-btn{ background:var(--green); box-shadow:0 4px 0 #2f7a63; }
.pass-btn{ background:var(--red); box-shadow:0 4px 0 var(--red-dark); }

/* ---------- Simon Says Carousel ---------- */
.simon-stage{ text-align:center; }
.simon-seats{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
.simon-seat{
  width:70px; height:70px; border-radius:50%; background:var(--seat-color,var(--teal)); color:#fff;
  font-size:1.6rem; font-weight:800; box-shadow:0 5px 0 rgba(0,0,0,.25); transition:transform .1s, filter .15s;
}
.simon-seat.lit{ filter:brightness(1.7); transform:scale(1.14); }
.simon-seat.shake{ animation:shakeX .4s; }
.simon-seat:disabled{ opacity:.65; }

/* ---------- Shell Game ---------- */
.shell-stage{ text-align:center; }
.shell-row{ position:relative; height:140px; margin:30px auto 0; width:max-content; }
.shell-cup{
  position:absolute; top:0; width:90px; height:110px;
  left:calc(var(--pos, 0) * 110px);
  background:linear-gradient(180deg, var(--red), var(--red-dark));
  border-radius:10px 10px 50% 50%/10px 10px 30% 30%;
  transition:left var(--swap-dur, .4s) ease;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;
  box-shadow:0 5px 0 rgba(0,0,0,.25);
}
.shell-cup.clickable{ cursor:pointer; }
.shell-cup.clickable:hover{ transform:translateY(-4px); }
.shell-cup.shake{ animation:shakeX .4s; }
.shell-reveal{ color:#fff; font-weight:800; font-size:1.6rem; opacity:0; transition:opacity .2s; }
.shell-cup.reveal-show .shell-reveal{ opacity:1; }

/* ---------- Shooting Gallery ---------- */
.gallery-lanes{ display:flex; flex-direction:column; gap:18px; margin-top:24px; }
.gallery-lane{ position:relative; height:60px; background:linear-gradient(180deg,#cfead1,#9fd8a5); border-radius:10px; overflow:hidden; border:3px solid var(--navy); }
.gallery-duck{
  position:absolute; top:50%; transform:translateY(-50%);
  width:52px; height:44px; border-radius:50% 50% 40% 40%;
  background:var(--gold); color:var(--navy); font-weight:800; font-size:1.1rem;
  animation:duckBounce var(--dur,4s) ease-in-out infinite; animation-delay:var(--delay,0s);
  box-shadow:0 3px 6px rgba(0,0,0,.2);
}
@keyframes duckBounce{ 0%,100%{ left:2%; } 50%{ left:85%; } }
.gallery-duck.duck-hit{ animation:none !important; transform:translateY(-120%) rotate(30deg); opacity:0; transition:all .4s; }
.gallery-duck.shake{ animation:shakeX .3s; }

/* ---------- Tilt-a-Whirl Spin & Stop ---------- */
.spin-stage{ text-align:center; }
.spin-wheel-wrap{ position:relative; width:280px; height:280px; margin:20px auto; }
.spin-pointer{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent;
  border-top:22px solid var(--red); z-index:2;
}
.spin-wheel{
  position:relative; width:100%; height:100%; border-radius:50%;
  border:6px solid var(--navy); overflow:hidden;
  background:conic-gradient(var(--red) 0% 12.5%, var(--gold) 12.5% 25%, var(--teal) 25% 37.5%, var(--pink) 37.5% 50%, var(--purple) 50% 62.5%, var(--green) 62.5% 75%, var(--red-dark) 75% 87.5%, var(--gold-dark) 87.5% 100%);
}
.spin-seg{ position:absolute; top:0; left:50%; width:2px; height:50%; transform-origin:bottom center; }
.spin-seg span{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  color:#fff; font-weight:800; font-size:1.1rem; text-shadow:1px 1px 2px rgba(0,0,0,.4);
}
.spin-stop-btn{ margin-top:6px; }
.spin-stop-btn:disabled{ opacity:.5; animation:none; }

/* ---------- Can Knockdown ---------- */
.cans-pyramid{ display:flex; flex-direction:column-reverse; align-items:center; gap:10px; margin-top:24px; }
.cans-row{ display:flex; gap:10px; justify-content:center; }
.can{
  width:60px; height:70px; border-radius:8px;
  background:repeating-linear-gradient(0deg, var(--teal) 0 8px, #1a7a94 8px 16px);
  color:#fff; font-weight:800; font-size:1.3rem; box-shadow:0 4px 0 #0d4f61;
  transition:transform .3s, opacity .3s;
}
.can.can-fall{ transform:rotate(95deg) translateY(30px); opacity:0; }
.can.shake{ animation:shakeX .4s; }

/* ---------- Beat the Clock Sprint ---------- */
.sprint-stage{ text-align:center; }

/* ---------- End overlay ---------- */
.end-overlay{
  position:absolute; inset:0; background:rgba(20,33,61,.85); display:flex; align-items:center; justify-content:center;
  border-radius:16px; animation:fadein .3s ease; z-index:20;
}
.end-card{
  background:var(--paper); border-radius:22px 14px 24px 16px; padding:34px 44px; text-align:center;
  border:5px solid var(--gold); box-shadow:0 10px 0 rgba(0,0,0,.3);
}
.end-card h2{ font-size:1.85rem; color:var(--red-dark); display:flex; align-items:center; justify-content:center; gap:10px; }
.end-card h2 .icon-svg{ width:1.1em; height:1.1em; color:var(--gold-dark); animation:spin 3s linear infinite; }
.stars{ display:flex; gap:8px; justify-content:center; margin:14px 0; font-size:2.2rem; }
.rating-star{ display:inline-flex; }
.rating-star.filled{ color:var(--gold); }
.rating-star.empty{ color:#d8d0c0; }
.end-card p{ font-weight:700; font-size:1.1rem; margin-bottom:6px; }
.end-note{ font-weight:600; color:#666; font-size:.95rem; margin-bottom:16px; }
.end-buttons{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
.end-buttons button{
  background:var(--teal); color:#fff; font-weight:700; padding:10px 18px; border-radius:999px;
  box-shadow:0 4px 0 #146d87; transition:transform .12s;
}
.end-buttons button:hover{ transform:translateY(-2px); }
.end-buttons button:nth-child(2){ background:var(--purple); box-shadow:0 4px 0 #4a3468; }
.end-buttons button:nth-child(3){ background:var(--red); box-shadow:0 4px 0 var(--red-dark); }

/* ---------- Confetti ---------- */
#confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:200; }
.confetti-piece{ position:fixed; width:9px; height:9px; border-radius:2px; animation:confettiFall .9s ease-out forwards; }
@keyframes confettiFall{ to{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0; } }
</style>
</head>
<body>

<div id="bg-decor"></div>
<div class="lights-frame">
  <div class="lights-edge top" id="lights-top"></div>
  <div class="lights-edge bottom" id="lights-bottom"></div>
  <div class="lights-edge left" id="lights-left"></div>
  <div class="lights-edge right" id="lights-right"></div>
</div>
<div class="canopy-band"></div>
<button class="lang-toggle" id="lang-toggle"></button>

<div id="app">

  <!-- MENU -->
  <section id="screen-menu" class="screen active">
    <div class="big-top-header">
      <div class="title-row">
        <span class="title-tent-icon"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 3 L21 19 H3 Z"/><path d="M12 3 V19"/><path d="M7.5 19 L10 8 M16.5 19 L14 8"/><path d="M2 21 H22"/></svg></span>
        <h1 id="main-title"></h1>
        <span class="title-tent-icon right"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 3 L21 19 H3 Z"/><path d="M12 3 V19"/><path d="M7.5 19 L10 8 M16.5 19 L14 8"/><path d="M2 21 H22"/></svg></span>
      </div>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
    <div class="ticker"><div class="ticker-track" id="ticker-track"></div></div>
    <div class="grade-tents">
      <button class="tent-card grade3" data-grade="3">
        <div class="tent-roof"></div>
        <div class="tent-letters">
          <span class="l1" style="--tilt:-6deg; animation-delay:0s;">A</span>
          <span class="l2" style="--tilt:4deg; animation-delay:.15s;">B</span>
          <span class="l3" style="--tilt:-3deg; animation-delay:.3s;">C</span>
        </div>
        <h2 data-i18n="grade3Title"></h2>
        <p data-i18n="grade3Sub"></p>
      </button>
      <button class="tent-card grade4" data-grade="4">
        <div class="tent-roof"></div>
        <div class="tent-letters">
          <span class="l1" style="--tilt:-6deg; animation-delay:0s;">a</span>
          <span class="l2" style="--tilt:4deg; animation-delay:.15s;">b</span>
          <span class="l3" style="--tilt:-3deg; animation-delay:.3s;">c</span>
        </div>
        <h2 data-i18n="grade4Title"></h2>
        <p data-i18n="grade4Sub"></p>
      </button>
    </div>
  </section>

  <!-- GAMES LIST -->
  <section id="screen-games" class="screen">
    <button class="btn-back" data-nav="menu"><span class="icon"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M15 5 L8 12 L15 19"/></svg></span><span data-i18n="backToGate"></span></button>
    <h2 id="games-title"></h2>
    <div id="games-grid" class="games-grid"></div>
  </section>

  <!-- SETUP -->
  <section id="screen-setup" class="screen">
    <button class="btn-back" data-nav="games"><span class="icon"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M15 5 L8 12 L15 19"/></svg></span><span data-i18n="backToBooths"></span></button>
    <div id="setup-content"></div>
  </section>

  <!-- PLAY -->
  <section id="screen-play" class="screen">
    <div class="play-topbar">
      <button class="btn-back small" data-nav="setup"><span class="icon"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M15 5 L8 12 L15 19"/></svg></span><span data-i18n="setupLabel"></span></button>
      <div id="play-info"></div>
      <button class="btn-back small" data-nav="menu"><span class="icon"><svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 11 L12 4 L20 11"/><path d="M6 10 V20 H18 V10"/><path d="M10 20 V14 H14 V20"/></svg></span><span data-i18n="menuLabel"></span></button>
    </div>
    <div id="play-area"></div>
  </section>

</div>

<div id="confetti-layer"></div>

<script>
/* ============================================================
   ICONS (hand-built line icons, no emoji)
============================================================ */
const ICONS = {
  arrowLeft: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M15 5 L8 12 L15 19"/></svg>',
  home: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M4 11 L12 4 L20 11"/><path d="M6 10 V20 H18 V10"/><path d="M10 20 V14 H14 V20"/></svg>',
  dice: '<svg viewBox="0 0 24 24" class="icon-svg"><rect x="3" y="3" width="18" height="18" rx="4"/><circle class="dot" cx="8" cy="8" r="1.3"/><circle class="dot" cx="16" cy="8" r="1.3"/><circle class="dot" cx="12" cy="12" r="1.3"/><circle class="dot" cx="8" cy="16" r="1.3"/><circle class="dot" cx="16" cy="16" r="1.3"/></svg>',
  target: '<svg viewBox="0 0 24 24" class="icon-svg"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle class="dot" cx="12" cy="12" r="1.4"/></svg>',
  mallet: '<svg viewBox="0 0 24 24" class="icon-svg"><rect x="2" y="2" width="10" height="7" rx="1.5" transform="rotate(-38 7 5.5)"/><path d="M9.5 9.5 L18.5 18.5"/></svg>',
  balloon: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 2 C7 2 5 6 5 10 C5 14.5 8.3 17.5 12 17.5 C15.7 17.5 19 14.5 19 10 C19 6 17 2 12 2 Z"/><path d="M12 17.5 L10.5 21 L13.5 21 Z"/><path d="M12 21 V22.5"/></svg>',
  steps: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M3 20 H8 V16 H13 V11 H18 V5 H21"/></svg>',
  wheel: '<svg viewBox="0 0 24 24" class="icon-svg"><circle cx="12" cy="12" r="9"/><circle class="dot" cx="12" cy="12" r="1.4"/><path d="M12 3 V21 M3 12 H21 M5.6 5.6 L18.4 18.4 M18.4 5.6 L5.6 18.4"/></svg>',
  magnifier: '<svg viewBox="0 0 24 24" class="icon-svg"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.2 15.2 L21 21"/></svg>',
  fish: '<svg viewBox="0 0 26 24" class="icon-svg"><path d="M2 12 C6 6 17 6 22 12 C17 18 6 18 2 12 Z"/><path d="M22 12 L25 8.5 M22 12 L25 15.5"/><circle class="dot" cx="7.5" cy="11" r="0.9"/></svg>',
  bell: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 3 C8.5 3 7.2 6.6 7.2 9.6 C7.2 13.5 5.3 14.6 5.3 16.4 H18.7 C18.7 14.6 16.8 13.5 16.8 9.6 C16.8 6.6 15.5 3 12 3 Z"/><path d="M9.3 16.4 C9.3 18.2 14.7 18.2 14.7 16.4"/><circle class="dot" cx="12" cy="2" r="1"/></svg>',

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickN(pool, n){ return shuffle(pool).slice(0, n); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

let audioCtx;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function playTone(freq=440, dur=0.15, type='sine', vol=0.2){
  ensureAudio();
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function playCorrect(){ playTone(880,0.12,'triangle',0.25); setTimeout(()=>playTone(1175,0.15,'triangle',0.2),100); }
function playWrong(){ playTone(150,0.25,'sawtooth',0.18); }
function playWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'triangle',0.25), i*140)); }

function confettiBurst(x,y,count=24){
  const colors=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
  const layer=document.getElementById('confetti-layer');
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.background=colors[randInt(0,colors.length-1)];
    const dx=randInt(-140,140), dy=randInt(-200,-40), rot=randInt(0,360);
    el.style.setProperty('--dx',dx+'px');
    el.style.setProperty('--dy',dy+'px');
    el.style.setProperty('--rot',rot+'deg');
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }
}

function buildFloaters(){
  const layer=document.getElementById('bg-decor');
  const colors=['#e63946','#ffb703','#219ebc','#ff5d8f','#6a4c93','#43aa8b'];

    const f=document.createElement('div');

    const size=randInt(10,26);
    f.style.width=size+'px'; f.style.height=size+'px';

    f.style.animationDuration=randInt(14,26)+'s';
    f.style.animationDelay='-'+randInt(0,20)+'s';

  }
}

function livenUpTitle(){
  const el=document.getElementById('main-title');
  el.textContent='';
  const text = T('appTitle');
  const palette=['t-red','t-gold','t-teal','t-pink','t-purple','t-green'];
  [...text].forEach((ch,i)=>{
    const span=document.createElement('span');
    span.textContent = ch===' ' ? '\u00A0' : ch;
    span.className = 'wave-letter ' + (ch===' ' ? '' : palette[i%palette.length]);
    span.style.animationDelay=(i*0.06)+'s';
    span.style.setProperty('--tilt', (Math.random()*12-6).toFixed(1)+'deg');
    el.appendChild(span);
  });
}

function applyTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = T(el.dataset.i18n);
  });
}

let activeKeyHandler=null;
let activeTimers=[];
let activeTimeouts=[];
let gameRunId=0;
function trackedTimeout(fn, delay){
  const id = setTimeout(()=>{
    activeTimeouts = activeTimeouts.filter(t=>t!==id);
    fn();
  }, delay);
  activeTimeouts.push(id);
  return id;
}
function detachKeyHandler(){
  gameRunId++;
  if(activeKeyHandler){ document.removeEventListener('keydown', activeKeyHandler); activeKeyHandler=null; }
  activeTimers.forEach(t=>clearInterval(t));
  activeTimers=[];
  activeTimeouts.forEach(t=>clearTimeout(t));
  activeTimeouts=[];
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openGames(grade){
  state.grade = grade;
  document.getElementById('games-title').textContent = grade===3 ? T('gradesListTitle3') : T('gradesListTitle4');
  const grid=document.getElementById('games-grid');
  grid.innerHTML='';
  GAMES[grade].forEach(g=>{
    const card=document.createElement('button');
    card.className='stall-card';
    card.innerHTML=`<div class="stall-icon">${icon(g.icon)}</div><h3>${tr(g.name)}</h3><p>${tr(g.tagline)}</p><span class="ribbon">${T('play')}</span>`;
    card.onclick=()=>openSetup(g.id);
    grid.appendChild(card);
  });
  showScreen('screen-games');
}

function currentGame(){ return GAMES[state.grade].find(g=>g.id===state.gameId); }

function openSetup(gameId){
  state.gameId = gameId;
  const game = currentGame();
  state.case = game.defaultCase;
  state.amount = game.quick[Math.floor(game.quick.length/2)] || game.quick[0];
  state.custom = {};
  (game.extraControls||[]).forEach(c=>{ state.custom[c.key] = c.default; });
  renderSetup(game);
  showScreen('screen-setup');
}

function renderSetup(game){
  const container = document.getElementById('setup-content');
  const caseSection = game.noCaseToggle
    ? `<p class="note">${T('bothCasesNote')}</p>`
    : `<div class="case-toggle">
         <button class="case-btn ${state.case==='upper'?'active':''}" data-case="upper">ABC</button>
         <button class="case-btn ${state.case==='lower'?'active':''}" data-case="lower">abc</button>
       </div>`;
  const extraHtml = (game.extraControls||[])
    .filter(c=>!c.showIf || state.custom[c.showIf.key]===c.showIf.equals)
    .map(c=>{
      if(c.type==='select'){
        return `<div class="setting-group">
          <label>${tr(c.label)}</label>
          <div class="amount-buttons">
            ${c.options.map(o=>`<button class="amt-btn extra-btn ${state.custom[c.key]===o.v?'active':''}" data-key="${c.key}" data-val="${o.v}">${tr(o.label)}</button>`).join('')}
          </div>
        </div>`;
      } else if(c.type==='color'){
        return `<div class="setting-group">
          <label>${tr(c.label)}</label>
          <input type="color" id="color-${c.key}" value="${state.custom[c.key]}" class="color-input">
        </div>`;
      } else if(c.type==='checkbox'){
        const checked = !!state.custom[c.key];
        return `<div class="setting-group">
          <label class="checkbox-label">
            <input type="checkbox" class="toggle-check" data-key="${c.key}" ${checked?'checked':''}>

          </label>
        </div>`;
      } else if(c.type==='range'){
        const val = state.custom[c.key];
        return `<div class="setting-group range-group">
          <label>${tr(c.label)}: <span class="range-val" id="rangeval-${c.key}">${val}${c.unit||''}</span></label>
          <input type="range" class="speed-slider" id="range-${c.key}" data-key="${c.key}" data-unit="${c.unit||''}"
            min="${c.min}" max="${c.max}" step="${c.step||1}" value="${val}">
          ${(c.minLabel||c.maxLabel) ? `<div class="slider-caption-row"><span>${c.minLabel?tr(c.minLabel):''}</span><span>${c.maxLabel?tr(c.maxLabel):''}</span></div>` : ''}
        </div>`;
      }
      return '';
    }).join('');
  container.innerHTML = `
    <div class="poster">
      <div class="poster-star">${icon('star')}</div>
      <h2>${icon(game.icon)}<span>${tr(game.name)}</span></h2>
      <p class="tagline">${tr(game.tagline)}</p>
      <div class="instructions-box">
        <h3>${icon('clipboard')}<span>${T('howToPlay')}</span></h3>
        <ul>${game.instructions.map(i=>`<li>${tr(i)}</li>`).join('')}</ul>
      </div>
      <div class="settings-row">
        <div class="setting-group">
          <label>${game.amountLabel ? tr(game.amountLabel) : T('amountDefaultLabel')}</label>
          <div class="amount-buttons">
            ${game.quick.map(n=>`<button class="amt-btn ${n===state.amount?'active':''}" data-amt="${n}">${n===26?T('all26'):n}</button>`).join('')}
            <button class="amt-btn random-btn" id="random-amt">${icon('dice')}<span>${T('random')}</span></button>
          </div>
          <div class="amount-label">${T('selected', state.amount)}</div>
        </div>
        <div class="setting-group">
          <label>${T('letterCase')}</label>
          ${caseSection}
        </div>
        ${extraHtml}
      </div>
      <button class="btn-start" id="btn-start">${T('startShow')}</button>
    </div>
  `;
  container.querySelectorAll('.amt-btn[data-amt]').forEach(btn=>{
    btn.onclick=()=>{ state.amount=parseInt(btn.dataset.amt,10); renderSetup(game); };
  });
  const randomBtn=document.getElementById('random-amt');
  if(randomBtn){
    randomBtn.onclick=()=>{
      const lo=Math.min(...game.quick), hi=Math.max(...game.quick);
      state.amount = randInt(lo,hi);
      renderSetup(game);
    };
  }
  container.querySelectorAll('.case-btn').forEach(btn=>{
    btn.onclick=()=>{ state.case=btn.dataset.case; renderSetup(game); };
  });
  container.querySelectorAll('.extra-btn').forEach(btn=>{
    btn.onclick=()=>{ state.custom[btn.dataset.key]=btn.dataset.val; renderSetup(game); };
  });
  container.querySelectorAll('.color-input').forEach(inp=>{
    inp.oninput=()=>{ state.custom[inp.id.replace('color-','')] = inp.value; };
  });
  container.querySelectorAll('.toggle-check').forEach(inp=>{
    inp.onchange=()=>{ state.custom[inp.dataset.key] = inp.checked; renderSetup(game); };
  });
  container.querySelectorAll('.speed-slider').forEach(inp=>{
    inp.oninput=()=>{
      const key = inp.dataset.key;
      state.custom[key] = parseFloat(inp.value);
      const valEl = document.getElementById('rangeval-'+key);
      if(valEl) valEl.textContent = inp.value + (inp.dataset.unit||'');
    };
  });
  document.getElementById('btn-start').onclick=()=>startCurrentGame();
}

/* ============================================================
   TIMER ATTACK MODE
   A shared "survival" driver: endless rounds, a per-round timer
   that gets shorter every time the score goes up, and the game
   ends the instant the player misses or the timer runs out.
   Games opt in by adding TIMER_ATTACK_CONTROL to extraControls
   and branching on state.custom.timerAttack in their init().
============================================================ */
function timerAttackLimit(score){
  return Math.max(1200, 6000 - score*220);
}
function endSurvival(score){
  detachKeyHandler();
  playWin();
  const area = playArea();
  const overlay = document.createElement('div');
  overlay.className='end-overlay';
  const starsEarned = score>=15 ? 3 : score>=8 ? 2 : score>=1 ? 1 : 0;
  let starsHtml='';
  for(let i=0;i<3;i++){
    starsHtml += `<span class="rating-star ${i<starsEarned?'filled':'empty'}">${icon('star')}</span>`;
  }
  overlay.innerHTML = `
    <div class="end-card">
      <h2>${icon('sparkle')}<span>${T('tada')}</span>${icon('sparkle')}</h2>
      <div class="stars">${starsHtml}</div>
      <p>${T('survivalScore', score)}</p>
      <div class="end-buttons">
        <button id="play-again">${T('playAgain')}</button>
        <button id="change-settings">${T('changeSettings')}</button>
        <button id="back-menu">${T('mainMenu')}</button>
      </div>
    </div>`;
  area.appendChild(overlay);
  confettiBurst(window.innerWidth/2, window.innerHeight/2, 44);
  document.getElementById('play-again').onclick=()=>startCurrentGame();
  document.getElementById('change-settings').onclick=()=>{ renderSetup(currentGame()); showScreen('screen-setup'); };
  document.getElementById('back-menu').onclick=()=>showScreen('screen-menu');
}

/* Generic endless-round driver used by several Timer Attack games.
   targetElId: id of the element that shows the current target letter.
   barElId: id of the timer-bar fill element.
   buildOptions(target, onResult): builds this round's clickable UI;
   must call onResult(true) on a correct pick, onResult(false) on a
   wrong one. Returning without calling onResult lets the round's
   own timer end things via timeout. */
function startTimerAttack({ pool, targetElId, barElId, buildOptions }){
  let score=0, timerHandle, roundOver=false;
  function nextRound(){
    clearTimeout(timerHandle);
    roundOver=false;
    const target = pool[randInt(0,pool.length-1)];
    const targetEl = document.getElementById(targetElId);
    if(targetEl) targetEl.textContent = target;
    setPlayInfo(T('survivalStatus', score));
    function onResult(correct){
      if(roundOver) return;
      roundOver=true;
      clearTimeout(timerHandle);
      if(correct){
        playCorrect();
        score++;
        trackedTimeout(nextRound, 400);
      } else {
        playWrong();
        trackedTimeout(()=>endSurvival(score), 400);
      }
    }
    buildOptions(target, onResult);
    const limit = timerAttackLimit(score);
    const bar = document.getElementById(barElId);
    if(bar){
      bar.style.transition='none'; bar.style.width='100%';
      requestAnimationFrame(()=>{ bar.style.transition='width '+(limit/1000)+'s linear'; bar.style.width='0%'; });
    }
    timerHandle = trackedTimeout(()=>onResult(false), limit);
  }
  nextRound();
}

/* ============================================================
   GAME — Ring Toss Letter Match
============================================================ */
function buildBalloonOptions(target, pool, fieldId, onPick){
  const balloonColors=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
  const distractors = pickN(pool.filter(l=>l!==target), Math.min(5, pool.length-1));
  const options = shuffle([target, ...distractors]);
  const field = document.getElementById(fieldId);
  if(!field) return;
  field.innerHTML='';
  options.forEach(letter=>{
    const b=document.createElement('button');
    b.className='balloon';
    b.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 45%), ${balloonColors[randInt(0,balloonColors.length-1)]}`;
    b.style.setProperty('--float-delay', (Math.random()*2)+'s');
    b.textContent = letter;
    b.onclick=()=>{
      if(letter===target){
        playCorrect();
        const r=b.getBoundingClientRect();
        confettiBurst(r.left+r.width/2, r.top);
        b.classList.add('pop');
        onPick(true);
      } else {
        playWrong();
        b.classList.add('shake');
        trackedTimeout(()=>b.classList.remove('shake'),400);
        onPick(false);
      }
    };
    field.appendChild(b);
  });
}

============================================================ */
function initBalloonOrder(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const letters = pickN(pool, state.amount);
  const sorted = [...letters].sort();
  let nextIdx=0, misses=0;
  const area=playArea();
  area.innerHTML = `<div class="order-stage">
      <div class="order-trail" id="order-trail"></div>
      <div class="balloon-field" id="balloon-field2"></div>
    </div>`;
  const trail=document.getElementById('order-trail');
  trail.innerHTML = sorted.map(l=>`<span class="trail-letter" data-l="${l}">${l}</span>`).join('');
  setPlayInfo(T('orderProgress', 0, sorted.length));
  const field=document.getElementById('balloon-field2');
  const balloonColors=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
  shuffle(letters).forEach(letter=>{
    const b=document.createElement('button'); b.className='balloon';
    b.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 45%), ${balloonColors[randInt(0,balloonColors.length-1)]}`;
    b.style.setProperty('--float-delay',(Math.random()*2)+'s');
    b.textContent=letter;
    b.onclick=()=>{
      if(b.disabled) return;
      if(letter===sorted[nextIdx]){
        playCorrect();
        b.classList.add('pop');
        b.disabled=true;
        const trailEl = trail.querySelector(`[data-l="${letter}"]`);
        if(trailEl) trailEl.classList.add('trail-done');
        nextIdx++;
        setPlayInfo(T('orderProgress', nextIdx, sorted.length));
        if(nextIdx>=sorted.length){
          const finalScore = Math.max(0, sorted.length-misses);
          trackedTimeout(()=>endGame(finalScore, sorted.length),500);
        }
      } else {
        playWrong(); misses++;
        b.classList.add('shake');
        trackedTimeout(()=>b.classList.remove('shake'),400);
      }
    };
    field.appendChild(b);
  });
}

/* ============================================================
   GAME — Ferris Wheel Memory
============================================================ */
function initFerrisMemory(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const pairsCount = Math.min(state.amount, 13);
  const letters = pickN(pool, pairsCount);
  const cardData = shuffle([...letters, ...letters]).map((l,i)=>({id:i, letter:l, flipped:false, matched:false}));
  let first=null, lock=false, matches=0, attempts=0;
  const area=playArea();
  area.innerHTML = `<div class="ferris-wrap"><div class="ferris-wheel" id="ferris-wheel"></div></div>`;
  const wheel=document.getElementById('ferris-wheel');
  const n=cardData.length;
  const radius = Math.min(215, 34*n/1.6);
  cardData.forEach((c,i)=>{
    const angle = (2*Math.PI*i)/n - Math.PI/2;
    const x = Math.cos(angle)*radius;
    const y = Math.sin(angle)*radius;
    const cab=document.createElement('button');
    cab.className='cabin';
    cab.style.transform=`translate(${x}px, ${y}px)`;
    cab.innerHTML=`<span class="cabin-inner"><span class="cabin-back">${icon('wheel')}</span><span class="cabin-face">${c.letter}</span></span>`;
    cab.onclick=()=>{
      if(lock || c.flipped || c.matched) return;
      c.flipped=true;
      cab.classList.add('flipped');
      if(!first){
        first={c,cab};
      } else {
        attempts++;
        if(first.c.letter===c.letter && first.c.id!==c.id){
          playCorrect();
          c.matched=true; first.c.matched=true;
          cab.classList.add('matched'); first.cab.classList.add('matched');
          matches++;
          first=null;
          setPlayInfo(T('matchesTries', matches, pairsCount, attempts));
          if(matches===pairsCount){
            trackedTimeout(()=>endGame(pairsCount, pairsCount, T('attemptsNote', attempts)),600);
          }
        } else {
          playWrong();
          lock=true;
          const fc=first.c, fcab=first.cab;
          trackedTimeout(()=>{
            c.flipped=false; fc.flipped=false;
            cab.classList.remove('flipped'); fcab.classList.remove('flipped');
            first=null; lock=false;
          },700);
        }
      }
    };
    wheel.appendChild(cab);
  });
  setPlayInfo(T('matchesTries', 0, pairsCount, 0));
}

/* ============================================================
   GAME — Find the Difference
============================================================ */
function initFindDiff(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const confusable = state.case==='upper' ? CONFUSABLE_UPPER : CONFUSABLE_LOWER;
  const rounds = state.amount;
  let round=0, score=0;
  const area=playArea();
  area.innerHTML = `<div class="diff-stage">
      <p class="diff-instruction">${icon('magnifier')}<span>${T('diffInstruction')}</span></p>
      <div class="diff-grid" id="diff-grid"></div>
    </div>`;

  function nextRound(){
    if(round>=rounds){ endGame(score, rounds); return; }
    setPlayInfo(T('roundScore', round+1, rounds, score));
    const base = pool[randInt(0,pool.length-1)];
    const oddOptions = confusable[base] || pool.filter(l=>l!==base);
    const odd = oddOptions[randInt(0,oddOptions.length-1)];
    const size = 15;
    const oddPos = randInt(0,size-1);
    const grid=document.getElementById('diff-grid');
    grid.innerHTML='';
    for(let i=0;i<size;i++){
      const cell=document.createElement('button');
      cell.className='diff-cell';
      const letter = (i===oddPos) ? odd : base;
      cell.textContent = letter;
      cell.style.transform = `rotate(${randInt(-6,6)}deg)`;
      cell.onclick=()=>{
        if(i===oddPos){
          playCorrect();
          cell.classList.add('found');
          const r=cell.getBoundingClientRect();
          confettiBurst(r.left+r.width/2, r.top);
          score++; round++;
          trackedTimeout(nextRound,500);
        } else {
          playWrong();
          cell.classList.add('shake');
          trackedTimeout(()=>cell.classList.remove('shake'),400);
        }
      };
      grid.appendChild(cell);
    }
  }
  nextRound();
}

/* ============================================================
   GAME — Letter Fishing Pond
============================================================ */
function initFishing(){
  const answerCase = state.case;
  const promptCase = answerCase==='upper' ? 'lower' : 'upper';
  const answerPool = answerCase==='upper' ? UPPER : LOWER;
  const promptPool = promptCase==='upper' ? UPPER : LOWER;
  const rounds = state.amount;
  const indices = pickN([...Array(26).keys()], rounds);
  const fishColors=['#ffb703','#fb8500','#ff5d8f','#43aa8b','#219ebc','#8ac926'];
  let idx=0, score=0;
  const area=playArea();
  area.innerHTML = `<div class="pond-stage">
      <div class="target-sign">${icon('fish')}<span>${T('catchLabel')}</span> <span id="fish-target"></span></div>
      <div class="pond" id="pond"></div>
    </div>`;

  function nextRound(){
    if(idx>=indices.length){ endGame(score, indices.length); return; }
    const letterIndex = indices[idx];
    document.getElementById('fish-target').textContent = promptPool[letterIndex];

/* ============================================================
   GAME — Coin Toss Case Match
============================================================ */
function initCoinMatch(){
  const pairsCount = Math.min(state.amount, 13);
  const letters = pickN(UPPER, pairsCount);
  const idxs = letters.map(l=>l.charCodeAt(0)-65);
  let cardData = [];
  idxs.forEach(i=>{
    cardData.push({letter:UPPER[i], key:i, id:'u'+i});
    cardData.push({letter:LOWER[i], key:i, id:'l'+i});
  });
  cardData = shuffle(cardData);
  let first=null, lock=false, matches=0, attempts=0;
  const area=playArea();
  area.innerHTML=`<div class="coin-grid" id="coin-grid"></div>`;
  const grid=document.getElementById('coin-grid');
  cardData.forEach(c=>{
    const coin=document.createElement('button'); coin.className='coin';
    coin.innerHTML=`<span class="coin-inner"><span class="coin-back">${icon('coin')}</span><span class="coin-face">${c.letter}</span></span>`;
    coin.onclick=()=>{
      if(lock || coin.classList.contains('flipped') || coin.classList.contains('matched')) return;
      coin.classList.add('flipped');
      if(!first){
        first={c,coin};
      } else {
        attempts++;
        if(first.c.key===c.key && first.c.id!==c.id){
          playCorrect();
          coin.classList.add('matched'); first.coin.classList.add('matched');
          matches++; first=null;
          setPlayInfo(T('matchesTries', matches, pairsCount, attempts));
          if(matches===pairsCount){
            trackedTimeout(()=>endGame(pairsCount, pairsCount, T('attemptsNote', attempts)),600);
          }
        } else {
          playWrong();
          lock=true;
          const fcoin=first.coin;
          trackedTimeout(()=>{
            coin.classList.remove('flipped'); fcoin.classList.remove('flipped');
            first=null; lock=false;
          },700);
        }
      }
    };
    grid.appendChild(coin);
  });
  setPlayInfo(T('matchesTries', 0, pairsCount, 0));
}

   GAME — Flying Letters
============================================================ */
function initFlying(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const sequence = pickN(pool, state.amount);
  const speedLevel = state.custom.speed || 5;
  const flyBaseDur = Math.round(8200 - ((speedLevel-1)/9) * (8200-1800));
  const sizeMap = {small:'2rem', medium:'3.4rem', large:'4.8rem'};
  const palette=['#e63946','#ffb703','#219ebc','#ff5d8f','#6a4c93','#43aa8b','#fb8500'];
  let idx=0, score=0, roundTimer;
  const area=playArea();
  area.innerHTML = `<div class="fly-stage-wrap">
      <div class="target-sign">${icon('target')}<span>${T('findLabel')}</span> <span id="fly-target"></span></div>
      <div class="fly-stage" id="fly-stage"></div>
    </div>`;
  const stage=document.getElementById('fly-stage');

  function edgePoint(edge){
    switch(edge){
      case 'top': return {x:randInt(5,95), y:-12};
      case 'bottom': return {x:randInt(5,95), y:112};
      case 'left': return {x:-12, y:randInt(5,95)};
      default: return {x:112, y:randInt(5,95)};
    }
  }
  let target;
  function spawn(letter, delay){
    trackedTimeout(()=>{
      if(!document.body.contains(stage)) return;
      const edges=['top','bottom','left','right'];
      const startEdge = edges[randInt(0,3)];
      let endEdge = edges[randInt(0,3)];
      if(endEdge===startEdge) endEdge = edges[(edges.indexOf(startEdge)+2)%4];
      const start = edgePoint(startEdge);
      const end = edgePoint(endEdge);
      const dur = flyBaseDur * (0.85+Math.random()*0.3);
      const el=document.createElement('button');
      el.className='fly-letter';
      el.textContent=letter;
      el.style.setProperty('--sx', start.x+'%');
      el.style.setProperty('--sy', start.y+'%');
      el.style.setProperty('--ex', end.x+'%');
      el.style.setProperty('--ey', end.y+'%');
      el.style.setProperty('--fly-dur', dur+'ms');
      el.style.fontSize = sizeMap[state.custom.size];
      const color = state.custom.colorMode==='choose' ? state.custom.color : palette[randInt(0,palette.length-1)];
      el.style.color = color;
      el.addEventListener('animationend', ()=>{ if(el.parentNode) el.remove(); });
      el.onclick=(e)=>{
        e.stopPropagation();
        if(letter===target){
          playCorrect();
          score++;
          finishRound();
        } else {
          playWrong();
          el.classList.add('wrong-flash');
          trackedTimeout(()=>{ if(el.parentNode) el.remove(); },200);
        }
      };
      stage.appendChild(el);
    }, delay);
  }
  function clearFlyers(){ stage.querySelectorAll('.fly-letter').forEach(el=>el.remove()); }
  function nextRound(){
    clearTimeout(roundTimer);
    if(idx>=sequence.length){ endGame(score, sequence.length); return; }
    target = sequence[idx];
    document.getElementById('fly-target').textContent = target;
    setPlayInfo(T('roundScore', idx+1, sequence.length, score));
    clearFlyers();
    const distractors = pickN(pool.filter(l=>l!==target), 3);
    const batch = shuffle([target, ...distractors]);
    batch.forEach((letter,i)=> spawn(letter, i*350));
    roundTimer = trackedTimeout(()=>{ idx++; playWrong(); clearFlyers(); nextRound(); }, flyBaseDur*1.6 + 1300);
  }
  function finishRound(){
    clearTimeout(roundTimer);
    idx++;
    clearFlyers();
    trackedTimeout(nextRound, 400);
  }
  nextRound();
}

function initClawTimerAttack(){
  const pool = state.case==='upper' ? UPPER : LOWER;

  let score=0, current=null, timerHandle, decided=false;
  const area=playArea();
  area.innerHTML = `<div class="claw-stage">
      <div class="target-sign">${icon('claw')}<span>${T('grabOnlyLabel')}</span> <span id="claw-target">${target}</span></div>

      <div class="claw-window" id="claw-window"><span class="claw-letter" id="claw-letter"></span></div>
      <div class="claw-buttons">
        <button class="claw-btn grab-btn" id="grab-btn">${T('grab')}</button>
        <button class="claw-btn pass-btn" id="pass-btn">${T('pass')}</button>
      </div>
    </div>`;
  const letterEl=document.getElementById('claw-letter');
  const win=document.getElementById('claw-window');
  function showNext(){
    clearTimeout(timerHandle);
    decided=false;
    if(Math.random()<0.45){ current=target; }
    else {
      let l;
      do{ l = pool[randInt(0,pool.length-1)]; } while(l===target);
      current=l;
    }
    letterEl.textContent = current;
    letterEl.style.animation='none';
    void letterEl.offsetWidth;
    letterEl.style.animation='';
    setPlayInfo(T('survivalStatus', score));
    const limit = timerAttackLimit(score);
    const bar=document.getElementById('claw-timer');
    if(bar){
      bar.style.transition='none'; bar.style.width='100%';
      requestAnimationFrame(()=>{ bar.style.transition='width '+(limit/1000)+'s linear'; bar.style.width='0%'; });
    }
    timerHandle = trackedTimeout(()=>decide(null), limit);
  }
  function decide(isGrab){
    if(decided) return;
    decided=true;
    clearTimeout(timerHandle);
    const isMatch = current===target;
    const correct = isGrab!==null && ((isGrab && isMatch) || (!isGrab && !isMatch));
    if(correct){
      playCorrect(); score++; win.classList.add('claw-correct');
      trackedTimeout(()=>{ win.classList.remove('claw-correct'); showNext(); }, 350);
    } else {
      playWrong(); win.classList.add('claw-wrong');
      trackedTimeout(()=>endSurvival(score), 500);
    }

  document.getElementById('grab-btn').onclick=()=>decide(true);
  document.getElementById('pass-btn').onclick=()=>decide(false);

/* ============================================================
   GAME — Test of Strength: Keyboard Smash
   A decaying power meter: press the shown key to pump it up, it
   drains on its own, the target key changes periodically, and
   whatever the meter reads when the timer ends is the score.
============================================================ */
function initKeyboard(){
  detachKeyHandler();
  const pool = state.case==='upper' ? UPPER : LOWER;
  const diff = state.custom.difficulty || 'medium';
  const diffSettings = {
    easy:   { decay:0.18, boost:7, changeMs:2600, penalty:1.5 },
    medium: { decay:0.30, boost:6, changeMs:2000, penalty:2.5 },
    hard:   { decay:0.45, boost:5, changeMs:1500, penalty:3.5 }
  }[diff];
  const totalSeconds = state.amount;
  let meter=0, timeLeft=totalSeconds, target=pool[randInt(0,pool.length-1)], bellRung=false, finished=false;
  const area=playArea();
  area.innerHTML = `<div class="strongman-stage">
      <div class="tower">
        <div class="bell" id="kb-bell">${icon('bell')}</div>
        <div class="tower-track"><div class="meter-fill" id="kb-meter"></div><div class="puck" id="kb-puck">${icon('mallet')}</div></div>
      </div>
      <div class="keyboard-info">
        <div class="target-sign">${icon('keyboard')}<span>${T('pressLabel')}</span> <span id="kb-target" class="target-pop">${target}</span></div>
        <p class="note">${T('keyboardNote')}${state.case==='upper' ? T('keyboardShiftNote') : ''}</p>
      </div>
    </div>`;
  function render(){
    const puck=document.getElementById('kb-puck');
    const fill=document.getElementById('kb-meter');
    if(puck) puck.style.bottom = meter+'%';
    if(fill) fill.style.height = meter+'%';
    setPlayInfo(T('meterTime', Math.round(meter), timeLeft));
  }
  function changeTarget(){
    if(finished) return;
    let next;
    do{ next = pool[randInt(0,pool.length-1)]; } while(next===target);
    target = next;
    const el=document.getElementById('kb-target');
    if(el){ el.textContent=target; el.classList.remove('target-pop'); void el.offsetWidth; el.classList.add('target-pop'); }
  }
  const startTime=Date.now();
  const decayTimer=setInterval(()=>{
    if(finished) return;
    meter = Math.max(0, meter - diffSettings.decay);
    render();
  }, 100);
  const changeTimer=setInterval(changeTarget, diffSettings.changeMs);
  const countdownTimer=setInterval(()=>{
    if(finished) return;
    timeLeft = Math.max(0, totalSeconds - Math.floor((Date.now()-startTime)/1000));
    render();
    if(timeLeft<=0) finish();
  }, 200);
  activeTimers.push(decayTimer, changeTimer, countdownTimer);
  function finish(){
    if(finished) return;
    finished=true;
    clearInterval(decayTimer); clearInterval(changeTimer); clearInterval(countdownTimer);
    detachKeyHandler();
    endGame(Math.round(meter), 100);
  }
  activeKeyHandler=(e)=>{
    if(finished) return;
    const key=e.key;
    if(key.length!==1 || !/[a-zA-Z]/.test(key)) return;
    if(key===target){
      playCorrect();
      meter = Math.min(100, meter + diffSettings.boost);
      if(meter>=100 && !bellRung){
        bellRung=true;
        const bell=document.getElementById('kb-bell');
        if(bell) bell.classList.add('rung');
        playWin();
        trackedTimeout(()=>{ const b=document.getElementById('kb-bell'); if(b) b.classList.remove('rung'); bellRung=false; }, 1200);
      }
    } else {
      playWrong();
      meter = Math.max(0, meter - diffSettings.penalty);
    }
    render();
  };
  document.addEventListener('keydown', activeKeyHandler);
  render();
}

/* ============================================================
   GAME — Carousel Lights: Simon Says
============================================================ */
function initSimon(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const seatLetters = pickN(pool, 6);
  const seqLen = state.amount;
  const sequence = Array.from({length:seqLen}, ()=> seatLetters[randInt(0,seatLetters.length-1)]);
  let playIdx=0, inputIdx=0, score=0;
  const area=playArea();
  area.innerHTML = `<div class="simon-stage">
      <div class="target-sign">${icon('lights')}<span>${T('simonWatch')}</span></div>
      <div class="simon-seats" id="simon-seats"></div>
    </div>`;
  const seatsWrap=document.getElementById('simon-seats');
  const colors=['#e63946','#ffb703','#219ebc','#ff5d8f','#6a4c93','#43aa8b'];
  seatLetters.forEach((letter,i)=>{
    const seat=document.createElement('button');
    seat.className='simon-seat';
    seat.style.setProperty('--seat-color', colors[i%colors.length]);
    seat.textContent=letter;
    seat.dataset.letter=letter;
    seat.disabled=true;
    seatsWrap.appendChild(seat);
  });
  setPlayInfo(T('simonRepeat', 0, sequence.length));
  function playback(){
    if(playIdx>=sequence.length){
      seatsWrap.querySelectorAll('.simon-seat').forEach(s=>s.disabled=false);
      wireInput();
      return;
    }
    const letter = sequence[playIdx];
    const seat = [...seatsWrap.children].find(s=>s.dataset.letter===letter);
    seat.classList.add('lit');
    playTone(440 + (seatLetters.indexOf(letter)*60), 0.25, 'triangle', 0.2);
    trackedTimeout(()=>{ seat.classList.remove('lit'); playIdx++; trackedTimeout(playback, 250); }, 500);
  }
  function wireInput(){
    seatsWrap.querySelectorAll('.simon-seat').forEach(seat=>{
      seat.onclick=()=>{
        const letter=seat.dataset.letter;
        seat.classList.add('lit');
        trackedTimeout(()=>seat.classList.remove('lit'),300);
        if(letter===sequence[inputIdx]){
          playCorrect();
          score++; inputIdx++;
          setPlayInfo(T('simonRepeat', inputIdx, sequence.length));
          if(inputIdx>=sequence.length){
            seatsWrap.querySelectorAll('.simon-seat').forEach(s=>s.disabled=true);
            trackedTimeout(()=>endGame(score, sequence.length), 500);
          }
        } else {
          playWrong();
          seat.classList.add('shake');
          trackedTimeout(()=>seat.classList.remove('shake'),400);
          seatsWrap.querySelectorAll('.simon-seat').forEach(s=>s.disabled=true);
          trackedTimeout(()=>endGame(score, sequence.length), 500);
        }
      };
    });
  }
  trackedTimeout(playback, 800);
}

/* ============================================================
   GAME — Shell Game: Find the Letter
============================================================ */
function initShell(){
  const pool = state.case==='upper' ? UPPER : LOWER;
  const diff = state.custom.difficulty || 'medium';
  const diffSettings = { easy:{cups:3,swaps:3}, medium:{cups:4,swaps:5}, hard:{cups:5,swaps:7} }[diff];
  const shuffleLevel = state.custom.shuffleSpeed || 5;
  const swapInterval = Math.round(700 - ((shuffleLevel-1)/9) * (700-180));
  const rounds = state.amount;
  let round=0, score=0;
  const area=playArea();
  const swapDur = Math.max(120, swapInterval-80);
  area.innerHTML = `<div class="shell-stage">
      <div class="target-sign">${icon('cup')}<span>${T('findLabel')}</span> <span id="shell-target"></span></div>
      <div class="shell-row" id="shell-row" style="width:${diffSettings.cups*110-20}px; --swap-dur:${swapDur}ms;"></div>
    </div>`;
  function nextRound(){
    if(round>=rounds){ endGame(score, rounds); return; }
    const letter = pool[randInt(0,pool.length-1)];
    document.getElementById('shell-target').textContent = letter;
    setPlayInfo(T('roundScore', round+1, rounds, score));
    const row=document.getElementById('shell-row');
    row.innerHTML='';
    const cupCount = diffSettings.cups;
    const cupEls=[];
    for(let id=0; id<cupCount; id++){
      const cup=document.createElement('div');
      cup.className='shell-cup';
      cup.style.setProperty('--pos', id);
      const label=document.createElement('span'); label.className='shell-reveal';
      cup.appendChild(label);
      row.appendChild(cup);
      cupEls.push(cup);
    }
    let hiddenCupId = randInt(0,cupCount-1);
    cupEls[hiddenCupId].querySelector('.shell-reveal').textContent = letter;
    cupEls[hiddenCupId].classList.add('reveal-show');
    trackedTimeout(()=>{
      cupEls[hiddenCupId].classList.remove('reveal-show');
      cupEls[hiddenCupId].querySelector('.shell-reveal').textContent='';
      let slotOf = cupEls.map((_,id)=>id);
      let swapsLeft = diffSettings.swaps;
      function doSwap(){
        if(swapsLeft<=0){ enableClicks(); return; }
        const idA = randInt(0,cupCount-1);
        let idB = randInt(0,cupCount-1);
        while(idB===idA) idB = randInt(0,cupCount-1);
        const tmp = slotOf[idA]; slotOf[idA]=slotOf[idB]; slotOf[idB]=tmp;
        cupEls[idA].style.setProperty('--pos', slotOf[idA]);
        cupEls[idB].style.setProperty('--pos', slotOf[idB]);
        swapsLeft--;
        trackedTimeout(doSwap, swapInterval);
      }
      trackedTimeout(doSwap, 400);
      function enableClicks(){
        cupEls.forEach((cup,id)=>{
          cup.classList.add('clickable');
          cup.onclick=()=>{
            cupEls.forEach(c=>{ c.onclick=null; c.classList.remove('clickable'); });
            if(id===hiddenCupId){
              playCorrect();
              cup.querySelector('.shell-reveal').textContent=letter;
              cup.classList.add('reveal-show');
              score++;
            } else {
              playWrong();
              cup.classList.add('shake');
              cupEls[hiddenCupId].querySelector('.shell-reveal').textContent=letter;
              cupEls[hiddenCupId].classList.add('reveal-show');
            }
            round++;
            trackedTimeout(nextRound,800);
          };
        });
      }
    }, 900);
  }
  nextRound();
}

function buildDuckOptions(target, pool, lanesId, durRange, onPick){
